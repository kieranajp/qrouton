<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>qrouton</title>
    <style>
      :root { --bg: #24273a; --fg: #cad3f5; --dim: #8087a2; --gutter: #1e2030; }
      html, body { margin: 0; height: 100%; background: var(--bg); }
      body { overflow: auto; }
      #document {
        padding: 12px 0;
        font: 13px/1.55 Menlo, ui-monospace, SFMono-Regular, monospace;
        color: var(--fg);
      }
      .row { padding: 0 16px; white-space: pre-wrap; word-break: break-word; }
      .add { background: #1c2b24; color: #a6da95; }
      .del { background: #2c2028; color: #ed8796; }
      .hunk { background: var(--gutter); color: var(--dim); }
      .file { color: #8aadf4; font-weight: 600; padding-top: 10px; }
    </style>
  </head>
  <body>
    <div id="document"></div>

    <script type="module">
      import { Call } from "/wails/runtime.js";

      const SERVICE = "github.com/kieranajp/qrouton/internal/desktop.Windows";
      const id = new URLSearchParams(location.search).get("id");

      // The window declares its format; nothing here guesses it from the text,
      // or a plain document quoting a diff would be painted as one.
      const META = ["diff --git", "index ", "--- ", "+++ ", "=== ",
                    "new file", "deleted file", "rename ", "similarity ",
                    "old mode", "new mode", "Binary files"];

      const diffClass = (line) => {
        if (META.some((prefix) => line.startsWith(prefix))) return "file";
        if (line.startsWith("@@")) return "hunk";
        if (line.startsWith("+")) return "add";
        if (line.startsWith("-")) return "del";
        return "";
      };

      const doc = await Call.ByName(SERVICE + ".Content", id);
      const body = document.getElementById("document");
      for (const line of doc.text.split("\n")) {
        const row = document.createElement("div");
        row.className = doc.format === "diff" ? "row " + diffClass(line) : "row";
        row.textContent = line;
        body.appendChild(row);
      }
    </script>
  </body>
</html>
