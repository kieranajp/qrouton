<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>qrouton</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <style>
      :root { --bg: #24273a; --fg: #cad3f5; --dim: #8087a2; --accent: #a6da95; --rule: #363a4f; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      #workbench { display: flex; flex-direction: column; height: 100%; }
      #chrome {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--dim); padding: 6px 10px; display: flex; gap: 14px;
        border-bottom: 1px solid var(--rule); user-select: none;
      }
      #mode { color: var(--accent); font-weight: 600; }
      #term { flex: 1; min-height: 0; padding: 4px 6px; }
    </style>
  </head>
  <body>
    <div id="workbench">
      <div id="chrome">
        <span id="mode"></span>
        <span id="phase"></span>
        <span id="identity"></span>
      </div>
      <div id="term"></div>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/vendor/addon-webgl.js"></script>
    <script type="module">
      import { Call, Events } from "/wails/runtime.js";

      const TERM_SERVICE = "github.com/kieranajp/qrouton/internal/desktop.Term";

      const term = new Terminal({
        fontFamily: "Menlo, ui-monospace, monospace",
        fontSize: 13,
        allowProposedApi: true,
        macOptionIsMeta: true,
        theme: { background: "#24273a", foreground: "#cad3f5", cursor: "#f4dbd6" },
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById("term"));
      try { term.loadAddon(new WebglAddon.WebglAddon()); } catch (e) { console.warn("webgl", e); }
      fit.fit();

      const encoder = new TextEncoder();
      const write = (s) => Call.ByName(TERM_SERVICE + ".Write", btoa(String.fromCharCode(...encoder.encode(s))));

      // The agent reads a lone LF as submit, but an LF inside a bracketed paste
      // as a literal newline.
      const SHIFT_ENTER = "\x1b[200~\n\x1b[201~";

      term.attachCustomKeyEventHandler((event) => {
        if (event.type !== "keydown") return true;
        if (event.key === "Enter" && event.shiftKey) {
          // Returning false stops xterm's keydown handling but not the
          // browser's own keypress, which would append a CR and submit.
          event.preventDefault();
          event.stopPropagation();
          write(SHIFT_ENTER);
          return false;
        }
        return true;
      });

      term.onData((data) => write(data));
      term.onBinary((data) => Call.ByName(TERM_SERVICE + ".Write", btoa(data)));

      // Emit(name, one) delivers the value itself; indexing it would take the
      // first character of the base64 string and fail silently in here.
      Events.On("pty:data", (event) => {
        const raw = atob(event.data);
        const buffer = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) buffer[i] = raw.charCodeAt(i);
        term.write(buffer);
      });
      // A clean exit takes the window with it, so this is only ever read after
      // a failure.
      Events.On("pty:exit", (event) => {
        term.write("\r\n\x1b[2m[session ended — status " + event.data + "]\x1b[0m\r\n");
      });

      Events.On("chrome:update", (event) => {
        const fields = event.data || {};
        document.getElementById("mode").textContent = fields.mode || "";
        document.getElementById("phase").textContent = fields.phase || "";
        document.getElementById("identity").textContent = fields.identity || "";
      });

      const resize = () => {
        fit.fit();
        Call.ByName(TERM_SERVICE + ".Resize", term.cols, term.rows);
      };
      new ResizeObserver(resize).observe(document.getElementById("term"));
      window.addEventListener("resize", resize);

      await Call.ByName(TERM_SERVICE + ".Start", term.cols, term.rows);
      term.focus();
    </script>
  </body>
</html>
