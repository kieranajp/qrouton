<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Docked diff document fixture</title>
    <style>
      :root {
        --surface-app: #24273a;
        --surface-chrome: #1e2030;
        --surface-terminal: #181926;
        --surface-raised: #363a4f;
        --text-primary: #cad3f5;
        --text-secondary: #a5adcb;
        --text-muted: #8087a2;
        --text-faint: #6e738d;
        --text-on-accent: #181926;
        --border-subtle: #363a4f;
        --border-default: #5b6078;
        --accent-action: #8aadf4;
        --accent-label: #eed49f;
        --accent-literal: #7dc4e4;
        --artifact-plan: #b7bdf8;
        --artifact-spec: #f5bde6;
        --artifact-research: #91d7e3;
        --artifact-note: #f0c6c6;
        --diff-add-bg: #e6ffed;
        --diff-add-fg: #17451f;
        --diff-del-bg: #ffeef0;
        --diff-del-fg: #611a20;
        --diff-hunk-bg: #30364d;
        --diff-file-fg: #9cc3ff;
        --ctp-surface-2: #5b6078;
        --caret: #f4dbd6;
        --shadow-focus: 3px 3px 0 rgb(138 173 244 / 16%);
      }
      html, body, #fixture { height: 100%; margin: 0; }
      body { background: var(--surface-app); }
      #fixture { display: flex; }
    </style>
  </head>
  <body>
    <main id="fixture"></main>
    <script type="module" src="./diff-document-fixture.js"></script>
  </body>
</html>
