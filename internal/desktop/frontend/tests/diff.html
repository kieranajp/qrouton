<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Diff fixture</title>
    <style>
      :root {
        --diff-add-bg: #1c2b24;
        --diff-add-fg: #a6da95;
        --diff-del-bg: #2c2028;
        --diff-del-fg: #ed8796;
        --diff-hunk-bg: #1e2030;
        --diff-file-fg: #8aadf4;
        --text-muted: #8087a2;
        --text-primary: #cad3f5;
        --space-4: 8px;
        --terminal: 14px/20px "Courier New", monospace;
      }

      body {
        margin: 0;
        color: var(--text-primary);
        font: var(--terminal);
      }

      #diff-root {
        box-sizing: border-box;
        width: 440px;
      }
    </style>
  </head>
  <body>
    <main id="diff-root"></main>
    <script type="module" src="./diff-fixture.js"></script>
  </body>
</html>
