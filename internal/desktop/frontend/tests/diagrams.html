<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Diagram fixture</title>
    <style>
      :root {
        --gutter: 4.5ch;
        --surface-terminal: #101116;
        --text-secondary: #b7bacf;
        --text-faint: #6a6e85;
        --accent-literal: #9ecae8;
        --border-subtle: #343746;
        --state-failed: #ed8796;
        --border-default: #596078;
      }

      body { margin: 0; }
      /* The pane's scroll root, so an unmodified wheel over a diagram has
         somewhere to go. */
      #scroller { height: 360px; overflow-y: auto; }
      #tail { height: 800px; }
      #markdown-root { box-sizing: border-box; width: 520px; }
    </style>
  </head>
  <body>
    <div id="scroller">
      <main id="markdown-root" class="markdown"></main>
      <div id="tail"></div>
    </div>
    <script type="module" src="./diagrams-fixture.js"></script>
  </body>
</html>
