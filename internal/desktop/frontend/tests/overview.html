<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Overview fixture</title>
    <style>
      :root {
        --surface-app: #24273a;
        --surface-terminal: #181926;
        --surface-raised: #363a4f;
        --text-primary: #cad3f5;
        --text-secondary: #a5adcb;
        --text-muted: #8087a2;
        --text-faint: #6e738d;
        --text-on-accent: #181926;
        --accent-action: #8aadf4;
        --accent-label: #eed49f;
        --accent-literal: #7dc4e4;
        --state-success: #a6da95;
        --state-running: #8bd5ca;
        --state-waiting: #f5a97f;
        --state-failed: #ed8796;
        --state-guided: #c6a0f6;
        --artifact-plan: #b7bdf8;
        --artifact-research: #91d7e3;
        --surface-chrome: #1e2030;
        --machine-sm: 400 11.5px/1.55 Menlo, monospace;
        --machine-xs: 400 10.5px/1.5 Menlo, monospace;
        --ui-scale: 1;
        --border-subtle: #363a4f;
        --border-default: #5b6078;
        --border-width: 1px;
        --radius: 0;
        --shadow-cube: 3px 3px 0 #363a4f;
        --wash-selected: rgba(138, 173, 244, 0.07);
        --role-editing: #a6da95;
        --role-reference: #8aadf4;
        --ctp-surface-2: #5b6078;
      }

      body { margin: 0; background: var(--surface-app); }
      #fixture { display: flex; flex-direction: column; width: 560px; height: 720px; }
      #fixture.narrow { width: 320px; }
    </style>
  </head>
  <body>
    <main id="fixture"></main>
    <script type="module" src="./overview-fixture.js"></script>
  </body>
</html>
