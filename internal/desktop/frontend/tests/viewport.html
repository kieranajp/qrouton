<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Viewport fixture</title>
    <style>
      body { margin: 0; }
      #root { width: 320px; height: 100px; overflow-y: auto; overflow-anchor: none; }
      #before { height: 200px; }
      [data-line] { box-sizing: border-box; margin: 0; }
      #target { height: 72px; }
      #following { height: 60px; }
      #gap { height: 180px; }
      #nested { height: 100px; padding: 20px 0; }
      #nested-child { height: 40px; }
      #tail { height: 200px; }
    </style>
  </head>
  <body>
    <div id="surface">
      <div id="root">
        <div id="content">
          <div id="before"></div>
          <p id="target" data-line="3" data-line-end="5">A paragraph rendered across several visual rows.</p>
          <p id="following" data-line="8" data-line-end="8">A following source block.</p>
          <div id="gap"></div>
          <div id="nested" data-line="20" data-line-end="24">
            <div id="nested-child" data-line="22" data-line-end="23">A nested list item.</div>
          </div>
          <div id="tail"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./viewport-fixture.js"></script>
  </body>
</html>
