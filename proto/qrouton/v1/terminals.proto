syntax = "proto3";

package qrouton.v1;

option go_package = "github.com/kieranajp/qrouton/internal/api/gen/qrouton/v1;qroutonv1";

// TerminalService drives the conversation and tab terminals alike, by id.
service TerminalService {
  // Attach starts a terminal that is not running when given a size. Otherwise
  // it replays from from_offset to this client alone, or the whole ring with
  // reset when that offset has fallen out. It never resizes without a size.
  rpc Attach(AttachRequest) returns (AttachResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Resize(ResizeRequest) returns (ResizeResponse);
  // Session names the session a terminal belongs to.
  rpc Session(SessionRequest) returns (SessionResponse);
}

message TerminalSize {
  int32 cols = 1;
  int32 rows = 2;
}

message AttachRequest {
  string terminal_id = 1;
  TerminalSize size = 2;
  optional uint64 from_offset = 3;
}

message AttachResponse {}

message WriteRequest {
  string terminal_id = 1;
  bytes data = 2;
}

message WriteResponse {}

message ResizeRequest {
  string terminal_id = 1;
  TerminalSize size = 2;
}

message ResizeResponse {}

message SessionRequest {
  string terminal_id = 1;
}

message SessionResponse {
  string slug = 1;
}

enum TerminalKind {
  TERMINAL_KIND_UNSPECIFIED = 0;
  TERMINAL_KIND_CONVERSATION = 1;
  TERMINAL_KIND_TAB = 2;
}

// TerminalOutput is one stretch of a terminal's output. offset is where data
// starts in everything the terminal has written.
message TerminalOutput {
  string terminal_id = 1;
  TerminalKind kind = 2;
  bytes data = 3 [json_name = "encoded"];
  bool replay = 4;
  bool first = 5;
  optional int32 exit_code = 6 [json_name = "exit_code"];
  uint64 offset = 7;
  bool reset = 8;
}

message TerminalExit {
  string terminal_id = 1;
  TerminalKind kind = 2;
  int32 code = 3;
}
