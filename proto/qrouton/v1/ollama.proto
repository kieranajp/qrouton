syntax = "proto3";

package qrouton.v1;

option go_package = "github.com/kieranajp/qrouton/internal/api/gen/qrouton/v1;qroutonv1";

// OllamaService reports on the embedding model and pulls it.
service OllamaService {
  rpc Check(CheckRequest) returns (CheckResponse);
  rpc Pull(PullRequest) returns (PullResponse);
  rpc CancelPull(CancelPullRequest) returns (CancelPullResponse);
}

// OllamaStatus is what the page draws semantic search from.
message OllamaStatus {
  string state = 1;
  string model = 2;
  string detail = 3;
  int32 completed = 4;
  int32 total = 5;
  string reason = 6;
  bool installed = 7;
}

message CheckRequest {}

message CheckResponse {
  OllamaStatus status = 1;
}

message PullRequest {}

message PullResponse {}

message CancelPullRequest {}

message CancelPullResponse {}
