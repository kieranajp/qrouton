name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The workbench is a WebKit window, so the binary links cgo. GTK4 only:
      # Wails also has a GTK3 backend behind a build tag, which we do not ship.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      # The pre-handoff gate from AGENTS.md, so CI and a developer's last command
      # are the same thing.
      - run: make check
