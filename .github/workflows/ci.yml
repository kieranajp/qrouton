name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The workbench is a WebKit window, so the binary links cgo and a Mac is the
  # only host that can build or test it. There is nothing to cross-compile to.
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The pre-handoff gate from AGENTS.md, so CI and a developer's last command
      # are the same thing.
      - run: make check
      # Intel Macs are still a release target; Go hands clang the arch itself.
      - run: go build -o /dev/null .
        env:
          GOARCH: amd64
          CGO_ENABLED: "1"
