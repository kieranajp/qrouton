name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/desktop/frontend/package-lock.json
      - run: make front
      - run: go test ./...

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          certificate_path="$RUNNER_TEMP/qrouton-certificate.p12"
          keychain_path="$RUNNER_TEMP/qrouton-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Build universal macOS app
        run: |
          signing_identity=${MACOS_SIGNING_IDENTITY:--}
          make app VERSION="$RELEASE_VERSION" BUILD_NUMBER="${{ github.run_number }}" SIGN_IDENTITY="$signing_identity"
          make archive VERSION="$RELEASE_VERSION"

      - name: Notarize macOS app
        if: env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        run: |
          xcrun notarytool submit dist/*.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/qrouton.app
          xcrun stapler validate dist/qrouton.app
          make archive VERSION="$RELEASE_VERSION"
          spctl --assess --type execute --verbose=2 dist/qrouton.app

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_VERSION" dist/*.zip dist/checksums.txt --clobber

  # The AUR package builds from the release tag's source tarball, so it only
  # needs the tag to exist — not the macOS job's artifacts.
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git pacman-contrib openssh
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_MAINTAINER_NAME: ${{ secrets.AUR_MAINTAINER_NAME }}
          AUR_MAINTAINER_EMAIL: ${{ secrets.AUR_MAINTAINER_EMAIL }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is unset; skipping the AUR push" >&2
            exit 0
          fi
          # makepkg refuses to run as root, and this container is.
          useradd --create-home builder
          chown -R builder:builder .
          # -p keeps the secrets in the environment but also root's HOME, which
          # builder cannot write and makepkg needs.
          su builder --preserve-environment -c \
            'HOME=/home/builder ./packaging/aur/publish.sh --push "${{ github.event.release.tag_name }}"'
