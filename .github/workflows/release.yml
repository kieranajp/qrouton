name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # cgo links WebKit, so both artifacts are built on a Mac. Go hands clang the
    # arch, which is why one arm64 runner can produce the amd64 slice too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/desktop/frontend/package-lock.json
      # This job drives go directly rather than through make, so the embedded
      # pages have to be built explicitly — without them the test job fails on
      # an empty embed and the release ships stale ones.
      - run: make front
      - run: go test ./...
      - name: Build binaries
        run: |
          mkdir -p dist
          for goarch in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$goarch \
              go build -trimpath -ldflags "-s -w" -o "dist/qrouton-darwin-${goarch}" .
          done
          (cd dist && shasum -a 256 * > checksums.txt)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
